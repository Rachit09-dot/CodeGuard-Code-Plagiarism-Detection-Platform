[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # line too long — handled by formatter
    "B008",   # do not perform function calls in default arguments (FastAPI pattern)
    "SIM108", # ternary operator — readability choice
    "UP007",  # X | Y union syntax — keep for clarity
]

[tool.ruff.lint.isort]
known-first-party = ["core", "backend"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
